name: Daily seminar update

on:
  schedule:
    # 08:00 UTC = 4:00 AM EDT / 3:00 AM EST
    - cron: '0 8 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: seminar-update
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Exits non-zero (leaving docs/index.html untouched) if the department
      # site is unreachable, so a network blip can't blank the table.
      - name: Build HTML page
        run: python build_html.py

      # GitHub Pages serves main/docs, so publishing == committing the file.
      - name: Commit updated table
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update seminar table $(date +%Y-%m-%d)"
            git push
          fi
